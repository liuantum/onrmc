name: Android apps

on:
  push:
    paths: ["apps/android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["apps/android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
    inputs:
      api_url:
        description: "Server the apps point at by default (can still be changed on the sign-in screen)"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APKs
        run: ./gradlew --no-daemon :driver:assembleDebug :owner:assembleDebug ${{ inputs.api_url && format('-Ponrmc.apiUrl={0}', inputs.api_url) || '' }}

      - name: Release signing key
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.ONRMC_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > release.jks; echo "have=true" >> "$GITHUB_OUTPUT"; else echo "have=false" >> "$GITHUB_OUTPUT"; fi

      - name: Build signed release APKs and bundles
        if: steps.key.outputs.have == 'true'
        env:
          ONRMC_KEYSTORE_FILE: release.jks
          ONRMC_KEYSTORE_PASSWORD: ${{ secrets.ONRMC_KEYSTORE_PASSWORD }}
          ONRMC_KEY_ALIAS: ${{ secrets.ONRMC_KEY_ALIAS }}
          ONRMC_KEY_PASSWORD: ${{ secrets.ONRMC_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :driver:assembleRelease :owner:assembleRelease :driver:bundleRelease :owner:bundleRelease -Ponrmc.versionCode=${{ github.run_number }} ${{ inputs.api_url && format('-Ponrmc.apiUrl={0}', inputs.api_url) || '' }}

      - uses: actions/upload-artifact@v4
        with:
          name: onrmc-android-debug
          path: apps/android/*/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.have == 'true'
        with:
          name: onrmc-android-release
          path: |
            apps/android/*/build/outputs/apk/release/*.apk
            apps/android/*/build/outputs/bundle/release/*.aab

      # A fixed download page for phones: https://github.com/<owner>/<repo>/releases/tag/android-latest
      - name: Publish APKs to the "android-latest" release
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          cp driver/build/outputs/apk/debug/*.apk out/onrmc-driver.apk
          cp owner/build/outputs/apk/debug/*.apk out/onrmc-owner.apk
          notes="Debug build of ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}, $(date -u +'%d %b %Y %H:%M UTC').
          onrmc-driver.apk: for truck drivers (trips, GPS, delivery proof).
          onrmc-owner.apk: for the plant owner (dashboard, alerts, live map).
          On the phone: download, allow installing from this source, install. On the sign-in screen enter the server address, e.g. 192.168.1.20 for a computer on the same Wi-Fi running the API, or your domain."
          gh release view android-latest >/dev/null 2>&1 || gh release create android-latest --prerelease --title "onrmc Android apps (latest)" --notes "$notes"
          gh release edit android-latest --notes "$notes"
          gh release upload android-latest out/onrmc-driver.apk out/onrmc-owner.apk --clobber
